services:
  - type: web
    name: whatsapp-chatgpt-bot-official
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SYSTEM_PROMPT
        value: You are a helpful WhatsApp assistant. Reply clearly and concisely.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: whatsapp_bot
